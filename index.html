<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winning Product Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--ink:#14213d;--mute:#5b6b85;--card:#fff;--line:#d5deea;--accent:#1f6feb;--good:#12805c;--mid:#b7791f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1522;--ink:#e8eefb;--mute:#93a3bf;--card:#16203a;--line:#26324f;--accent:#5b9bff;--good:#3ecf9a;--mid:#e5b24a;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:860px;margin:0 auto;padding:32px 18px 60px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px;max-width:56ch}
.cmd{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.cmd input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;padding:10px;min-width:0;outline:none}
.cmd:focus-within{outline:2px solid var(--accent)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 28px}
.chip{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 12px;font-weight:400;font-size:.9rem}
.chip:hover{color:var(--ink);border-color:var(--accent)}
#status{color:var(--mute);margin:8px 0}
.err{color:var(--bad)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item h2{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;margin:0}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2rem;line-height:1}
.score small{display:block;font-size:.7rem;font-weight:500;color:var(--mute);text-align:right}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0;font-size:.92rem}
.facts b{font-weight:600}
.item p{margin:6px 0;max-width:70ch}
.links a{color:var(--accent);margin-right:14px;font-size:.9rem}
.risk{color:var(--mid)}
</style>
</head>
<body>
<main>
  <h1>Winning Product Finder</h1>
  <p class="sub">Apna niche ya command likhein. Yeh 6 product ideas score, margin aur ad angle ke saath dega.</p>
  <div class="cmd">
    <input id="q" placeholder="e.g. trending pet products under $15 cost" aria-label="Command" autofocus>
    <button id="go">Find products</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="status"></div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const examples = ["Trending kitchen gadgets under $10 cost","Pet products with high margin","Car accessories for Pakistan/UAE buyers","Problem-solving home organizers","Fitness gadgets, low competition"];
examples.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=()=>{$("q").value=t;run()};$("chips").appendChild(b)});
$("go").onclick=run;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")run()});

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scoreColor = n => n>=75?"var(--good)":n>=55?"var(--mid)":"var(--bad)";

async function run(){
  const command=$("q").value.trim();
  if(!command){$("status").textContent="Pehle command likhein.";return}
  $("go").disabled=true;$("out").innerHTML="";$("status").className="";$("status").textContent="Products dhoond raha hon...";
  try{
    const r=await fetch("/.netlify/functions/find",{method:"POST",body:JSON.stringify({command})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Request fail ho gayi");
    const list=(d.products||[]).sort((a,b)=>b.score-a.score);
    $("status").textContent=list.length+" ideas mile. AI ke andaze hain, spend se pehle Google Trends aur TikTok Ad Library par verify karein.";
    $("out").innerHTML=list.map(p=>{
      const profit=(p.sell_usd-p.cost_usd).toFixed(2), margin=p.sell_usd?Math.round((p.sell_usd-p.cost_usd)/p.sell_usd*100):0;
      const terms=(p.search_terms||[]);
      const q=encodeURIComponent(terms[0]||p.name);
      return `<article class="item">
        <div class="top"><h2>${esc(p.name)}</h2><div class="score" style="color:${scoreColor(p.score)}">${esc(p.score)}<small>score</small></div></div>
        <div class="facts"><span>Cost <b>$${esc(p.cost_usd)}</b></span><span>Sell <b>$${esc(p.sell_usd)}</b></span><span>Profit <b>$${profit} (${margin}%)</b></span><span>Competition <b>${esc(p.competition)}</b></span></div>
        <p>${esc(p.why)}</p>
        <p><b>Ad angle:</b> ${esc(p.ad_angle)}</p>
        <p class="risk"><b>Risk:</b> ${esc(p.risk)}</p>
        <div class="links">
          <a target="_blank" rel="noopener" href="https://trends.google.com/trends/explore?q=${q}">Google Trends</a>
          <a target="_blank" rel="noopener" href="https://www.aliexpress.com/wholesale?SearchText=${q}">AliExpress</a>
          <a target="_blank" rel="noopener" href="https://www.tiktok.com/search?q=${q}">TikTok</a>
          <a target="_blank" rel="noopener" href="https://www.facebook.com/ads/library/?q=${q}">Ad Library</a>
        </div></article>`}).join("");
  }catch(e){$("status").className="err";$("status").textContent=e.message}
  $("go").disabled=false;
}
</script>
</body>
</html>
